name: CI

on:
  push:
    branches: [main, modernize]
  pull_request:
    branches: [main, modernize]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      # NEXT_PUBLIC_* vars are inlined into the client bundle at build
      # time - without one set here, `next build` would silently succeed
      # with the literal string "undefined" baked in as the API base URL.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://ci-build-placeholder.invalid
